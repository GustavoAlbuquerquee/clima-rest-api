spring.application.name=clima-rest-api
server.port=8080

open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
open-meteo.timeout-segundos=10
open-meteo.api-key=${OPEN_METEO_API_KEY:}

open-meteo.cidade-padrao.nome=Belo Horizonte
open-meteo.cidade-padrao.estado=Minas Gerais
open-meteo.cidade-padrao.pais=Brasil
open-meteo.cidade-padrao.latitude=-19.92083
open-meteo.cidade-padrao.longitude=-43.93778
open-meteo.cidade-padrao.fuso-horario=America/Sao_Paulo

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.br.com.pucminas.clima=INFO
